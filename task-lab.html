<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务处理与数据结构实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#09131c;color:#dcebf1;font:15px system-ui}header,main{max-width:1500px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #25404a}h1{font-size:23px;margin:0}a{color:#71dfde}p,.hint{color:#9bb3bc;line-height:1.6}main{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#10232d;border:1px solid #29434e;border-radius:10px;padding:18px;margin-bottom:16px}h2{font-size:16px;margin:0 0 14px;color:#7de3dc}label{display:block;margin:10px 0 4px;color:#a9c1c9}input,select,button{font:inherit;color:#e3f4f5;background:#172f3b;border:1px solid #3a5963;border-radius:5px;padding:8px;width:100%}button{cursor:pointer;width:auto}button:hover{border-color:#69ded1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.primary{background:#1d746e}.stages{display:flex;gap:8px;flex-wrap:wrap}.stage{flex:1;min-width:115px;background:#172f3b;border:1px solid #35515b;border-radius:6px;padding:10px}.stage.active{border-color:#75ebd8;background:#22584f}.stage.done{opacity:.65}.stage small{display:block;color:#a3bec4;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px;overflow-wrap:anywhere}td,th{text-align:left;border-bottom:1px solid #29434e;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:13px/1.6 monospace}.structures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.structures .card{margin:0}.status{padding:14px;background:#183a3c;border-left:3px solid #6ce1d3;line-height:1.6} @media(max-width:800px){main{grid-template-columns:1fr}.structures{grid-template-columns:1fr}header{gap:12px;flex-wrap:wrap}}
body.embedded header{display:none}body.embedded main{display:block;padding:10px}body.embedded .card{padding:12px;margin-bottom:10px}body.embedded .structures{display:block}body.embedded .structures .card{margin-bottom:10px}body.embedded .stages{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0 12px}
body.embedded .stage{flex:none;min-width:0;padding:4px 7px;border:1px solid #35515b;background:#172f3b;font-size:12px;line-height:1.35}
body.embedded .stage.active{border-color:#8dffe8;background:#277669;color:#fff;font-weight:700;box-shadow:0 0 0 2px rgba(117,235,216,.25)}
body.embedded .stage small{display:none}body.embedded .step-arrow{color:#77c4bd;font-size:15px;line-height:1}
body.embedded section > .card > .actions,body.embedded section > .card > .status,body.embedded section > .card > .hint{display:none}
body.embedded #finish{display:none}body.embedded .status-line+.status-line{margin-top:10px}body.embedded .status-label{color:#9eebda;font-weight:700}body.embedded h2{font-size:14px}body.embedded .hint{font-size:12px}body.embedded .actions{gap:5px}body.embedded button{font-size:13px}body.embedded .grid{gap:5px}body.embedded input,body.embedded select{padding:6px}
.card.changed{border:2px solid #7df9df;background:#174b46;box-shadow:0 0 0 2px rgba(107,255,219,.18),0 0 16px rgba(107,255,219,.3)}
.card.changed h2{color:#bcffed}tr.rule-hit td{background:#27685b;color:#fff;font-weight:700}tr.rule-hit td:first-child{box-shadow:inset 4px 0 #79ffdf}
body.embedded .structures .card{margin-bottom:10px}body.embedded details.config{margin-top:8px}body.embedded details.config>summary{cursor:pointer;background:#1b3b46;padding:12px;border:1px solid #54817f;color:#a3f3e4;font-weight:700}body.embedded details.config[open]>summary{margin-bottom:8px}body.embedded .status{font-size:13px}body.embedded th,body.embedded td{padding:6px 3px;font-size:12px}
</style></head><body><header><div><h1>任务处理与数据结构实验</h1><p>同一智能网卡 · 三类任务 · 逐步追踪</p></div><a id="back-home" href="index.html">← 返回硬件实验台</a></header><main><aside><div class="card"><h2>01 / 任务与报文</h2><label for="task">任务类型</label><select id="task"><option>转发</option><option>流表匹配</option><option>统计</option></select><div class="grid"><div><label for="src">源 IP</label><input id="src" value="10.0.2.15"></div><div><label for="dst">目的 IP</label><input id="dst" value="10.0.9.20"></div><div><label for="proto">协议</label><select id="proto"><option>TCP</option><option>UDP</option><option>ICMP</option></select></div><div><label for="size">长度 / 字节</label><input id="size" type="number" min="1" max="65535" value="1500"></div><div><label for="sport">源端口</label><input id="sport" type="number" min="0" max="65535" value="49152"></div><div><label for="dport">目的端口</label><input id="dport" type="number" min="0" max="65535" value="443"></div></div><p class="hint">统计任务以五元组作为流键；端口可填 0。完成后可修改报文并继续，保留数据结构；任务或规则变更需重新应用。</p></div><div class="card"><h2>02 / 规则配置</h2><p class="hint">每行：优先级, 协议, 目的端口, 动作。协议可填 ANY，空端口表示通配。动作：转发、丢弃、上送CPU。</p><textarea id="rules" rows="5" style="width:100%;background:#172f3b;color:#e3f4f5;border:1px solid #3a5963;padding:8px">100,TCP,443,转发
90,TCP,23,丢弃
80,UDP,,上送CPU</textarea><div class="actions"><button id="reset">应用配置并重置</button></div><div id="error" role="alert"></div></div></aside><section><div class="card"><h2>03 / 硬件处理路径</h2><div class="stages" id="stages"></div><div class="actions"><button id="previous">上一步</button><button class="primary" id="next">下一步</button><button id="finish">执行至结束</button><button id="again">使用当前报文继续</button></div><div id="status" class="status" aria-live="polite"></div><p class="hint">这是机制级教学模拟，硬件模块和哈希桶均为示意，不代表实际产品实现或性能。</p></div><div class="structures"><div class="card"><h2>接收 / 发送队列 · SRAM</h2><pre id="queues"></pre></div><div class="card"><h2>规则表 · TCAM</h2><div id="table"></div></div><div class="card"><h2>流哈希表 · 8 桶</h2><pre id="hash"></pre></div><div class="card"><h2>计数器与结果</h2><pre id="counts"></pre></div></div></section></main><script src="task-engine.js"></script><script>
const $=id=>document.getElementById(id);let state;let taskHistory=[];
const embedded=new URLSearchParams(location.search).has('embedded');
if(embedded){
 document.body.classList.add('embedded');$('back-home').hidden=true;
 const main=document.querySelector('main'),aside=main.querySelector('aside'),section=main.querySelector('section');
 // Preserve the queue card before the rule table.
 const details=document.createElement('details');details.className='config';
 const summary=document.createElement('summary');summary.textContent='配置任务、报文与规则';details.append(summary,aside);
 main.replaceChildren(section,details);
}

const stages=[['接收','MAC / SRAM'],['出队与解析','SRAM / P4'],['查询','TCAM 或哈希引擎'],['执行与更新','P4 / 计数器'],['入队或分流','SRAM / PCIe'],['发送','MAC']];
function readPacket(){if(['size','sport','dport'].some(id=>$(id).value.trim()===''))throw Error('长度和端口不能为空。');let packet={src:$('src').value.trim(),dst:$('dst').value.trim(),proto:$('proto').value,size:Number($('size').value),sport:Number($('sport').value),dport:Number($('dport').value)};const ip=x=>{let a=x.split('.');return a.length===4&&a.every(v=>/^\d{1,3}$/.test(v)&&+v<=255)};if(!ip(packet.src)||!ip(packet.dst)||!Number.isInteger(packet.size)||packet.size<1||packet.size>65535||!['sport','dport'].every(k=>Number.isInteger(packet[k])&&packet[k]>=0&&packet[k]<=65535))throw Error('请输入有效 IPv4 地址、长度和端口。');return packet;}
function configure(){try{let packet=readPacket();let rules=$('rules').value.split('\n').filter(x=>x.trim()).map(line=>{let a=line.split(',').map(x=>x.trim());if(a.length!==4||!/^\d+$/.test(a[0])||!['TCP','UDP','ICMP','ANY'].includes(a[1])||(a[2]!==''&&(!/^\d+$/.test(a[2])||+a[2]>65535))||!['转发','丢弃','上送CPU'].includes(a[3]))throw Error('规则格式有误，请检查每行的四个字段。');return {priority:+a[0],proto:a[1],dport:a[2],action:a[3]}});state=Lab.create(packet,rules,$('task').value);taskHistory=[];$('error').textContent='';render();return true}catch(e){$('error').textContent=e.message;return false}}
function render(){ if(embedded) parent.postMessage({type:'smartnic-task-state',state:{step:state.step,canUndo:taskHistory.length>0,task:state.task,result:state.result,log:state.log,packet:state.packet,rules:state.rules,matchId:state.task==='统计'?null:state.match?.id,rx:state.rx.length,tx:state.tx.length,counts:state.counts,flows:state.buckets.flat().length}},'*'); $('stages').innerHTML=stages.map((x,i)=>`<div class="stage ${state.step===i+1?'active':state.step>i+1?'done':''}" ${state.step===i+1?'aria-current="step"':''}>${i+1}. ${x[0]}<small>${x[1]}</small></div>`).join('<span class="step-arrow" aria-hidden="true">→</span>');
const status=$('status');status.replaceChildren();
const op=document.createElement('div');op.className='status-line';const opLabel=document.createElement('span');opLabel.className='status-label';opLabel.textContent='当前操作：';op.append(opLabel,document.createTextNode(`${state.step}/6 · ${state.log}`));
const result=document.createElement('div');result.className='status-line';const resultLabel=document.createElement('span');resultLabel.className='status-label';resultLabel.textContent='处理结果：';result.append(resultLabel,document.createTextNode(`${state.result} · 已应用任务：${state.task}`));status.append(op,result);$('queues').textContent=`接收队列 (${state.rx.length})\n${state.rx.map(p=>p.src+' → '+p.dst).join('\n')||'空'}\n\n发送队列 (${state.tx.length})\n${state.tx.map(p=>p.src+' → '+p.dst).join('\n')||'空'}`;let table=document.createElement('table');let rows=[['编号','优先级','协议','目的端口','动作','命中'],...state.rules.map(r=>[r.id,r.priority,r.proto,r.dport||'*',r.action,r.hits])];rows.forEach((row,i)=>{let tr=table.insertRow();if(i>0 && state.task!=='统计' && state.step>=3 && state.match && state.match.id===row[0])tr.className='rule-hit';row.forEach(v=>{let c=document.createElement(i?'td':'th');c.textContent=v;tr.appendChild(c)})});$('table').replaceChildren(table);
let explain=$('match-explain');if(!explain){explain=document.createElement('p');explain.id='match-explain';explain.style.cssText='font-size:13px;line-height:1.6;color:#b5e8dc;margin:8px 0';$('table').after(explain)}
if(state.task==='统计') explain.textContent='统计任务按五元组查询哈希表，不使用此规则表。';
else if(state.step<3) explain.textContent=`待查询：报文协议 ${state.packet.proto}，目的端口 ${state.packet.dport}；按优先级从高到低匹配。`;
else if(state.match) explain.textContent=`命中 #${state.match.id}：协议 ${state.packet.proto} ${state.match.proto==='ANY'?'匹配任意协议':'匹配 '+state.match.proto}；目的端口 ${state.packet.dport} ${state.match.dport===''?'匹配任意端口':'匹配 '+state.match.dport}，动作：${state.match.action}。`;
else explain.textContent=`未命中：协议 ${state.packet.proto}、目的端口 ${state.packet.dport} 没有匹配规则，将上送 CPU。`;
$('hash').textContent=state.buckets.map((b,i)=>`${i}: ${b.length?b.map(e=>`${e.key} → ${e.packets} 包 / ${e.bytes} 字节`).join(' ; '):'空'}`).join('\n');let c=state.counts;$('counts').textContent=`接收 ${c.received} · 转发 ${c.forwarded} · 丢弃 ${c.dropped} · 上送 CPU ${c.cpu}\n${state.task==='统计'?`统计字节 ${c.bytes}\n`:''}当前处理结果：${state.result}`;$('previous').disabled=taskHistory.length===0;$('next').disabled=state.step===6;$('finish').disabled=state.step===6;$('again').disabled=state.step!==6;
 const changes=state.step===1?['queues','counts']:state.step===2?['queues']:state.step===3?[state.task==='统计'?'hash':'table']:state.step===4?(state.task==='统计'?['hash','counts']:['table']):state.step===5?['queues','counts']:state.step===6?['queues','counts']:[];
 ['queues','table','hash','counts'].forEach(id=>$(id).closest('.card').classList.toggle('changed',changes.includes(id)));
 $('table').closest('.card').hidden=embedded || state.task==='统计';
 $('hash').closest('.card').hidden=state.task!=='统计';
}
window.addEventListener('message',e=>{if(!embedded||e.source!==parent||!e.data||e.data.type!=='smartnic-task-command')return;const id=e.data.command;if(['previous','next','finish','again'].includes(id) && !$(id).disabled)$(id).click()});
function advance(){if(state.step>=6)return false;taskHistory.push(Lab.snapshot(state));Lab.next(state);return true}
$('reset').onclick=configure;$('previous').onclick=()=>{if(taskHistory.length){state=taskHistory.pop();render()}};$('next').onclick=()=>{advance();render()};$('finish').onclick=()=>{while(advance()){}render()};$('again').onclick=()=>{try{state.packet=readPacket();taskHistory=[];state.step=0;state.match=null;state.result='待处理';state.log='准备接收下一包；沿用已应用的任务和规则';$('error').textContent='';render()}catch(e){$('error').textContent=e.message}};configure();
</script></body></html>
